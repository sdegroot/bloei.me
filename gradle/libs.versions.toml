[versions]
kotlin = "2.3.21"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
ktlint = "14.2.0"
kover = "0.9.9"
cyclonedx = "3.3.0"
spring-modulith = "2.1.0"
exposed = "1.2.0"
dbos = "1.0.0"
playwright = "1.61.0"
axe-playwright = "4.10.2"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
dbos-spring-boot = { module = "dev.dbos:transact-spring-boot-starter", version.ref = "dbos" }
dbos-spring-txstep = { module = "dev.dbos:transact-spring-txstep-starter", version.ref = "dbos" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
axe-playwright = { module = "com.deque.html.axe-core:playwright", version.ref = "axe-playwright" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
