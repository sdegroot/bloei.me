name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Format, architecture, unit, integration, and artifact checks
        run: ./gradlew check :app:koverXmlReport

      - name: Install Chromium and system dependencies
        run: ./gradlew :app:playwrightInstallWithDeps

      - name: Browser and accessibility checks
        run: ./gradlew :app:browserTest

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: app/build/reports/cyclonedx/application.cdx.json
          if-no-files-found: error
          retention-days: 30

  image:
    name: OCI image
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_DB: bloei
          POSTGRES_USER: bloei
          POSTGRES_PASSWORD: bloei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloei -d bloei"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build OCI image
        run: ./gradlew :app:bootBuildImage --imageName=bloei-me:ci

      - name: Verify non-root startup and health
        run: |
          image_user="$(docker image inspect bloei-me:ci --format '{{.Config.User}}')"
          test -n "$image_user"
          test "$image_user" != "0"
          container_id="$(docker run --detach --network host \
            --env SPRING_PROFILES_ACTIVE=image-smoke \
            --env BLOEI_DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/bloei \
            --env BLOEI_DATABASE_USERNAME=bloei \
            --env BLOEI_DATABASE_PASSWORD=bloei \
            --env BLOEI_DBOS_EXECUTOR_ID=bloei-ci \
            bloei-me:ci)"
          trap 'docker logs "$container_id"; docker stop "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Scan OCI image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: bloei-me:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
