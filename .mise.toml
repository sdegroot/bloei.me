[tools]
java = "temurin-25.0.3+9.0.LTS"
gradle = "9.6.1"
gitleaks = "8.30.1"

[tasks.format]
run = "./gradlew ktlintFormat"

[tasks.check]
run = "./gradlew check"

[tasks.browser-install]
run = "./gradlew :apps:app:playwrightInstall"

[tasks.full-check]
run = "./gradlew :apps:app:fullCheck"

[tasks.dev]
run = "./gradlew :apps:app:bootRunDev"

[tasks.up]
run = "docker compose up --build"
