# Extends the default gitleaks rules.
[extend]
useDefault = true

# The voiceover manifest stores a 16-hex content hash per clip ("key"), used to reuse unchanged
# clips. It is not a secret, but matches the generic-api-key rule.
[[allowlists]]
description = "voiceover clip cache keys"
paths = ['''video/src/voiceover\.json''']
regexes = ['''"key": "[0-9a-f]{16}"''']
